name: CI

# Runs the same site build the deploy uses, so a pull request cannot merge a
# source layout the deploy would reject: a slug with two sources, a manifest
# entry with no page, a malformed articles.json, or a markdown page the renderer
# cannot handle. Then checks spelling in the sources and every internal link in
# the built site. The deploy workflow stays separate and runs only on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown codespell
      - run: python3 tools/build_site.py --out _site
      - name: Rendered pages present
        run: |
          for md in guides/*.md; do
            page="_site/$(basename "$md" .md).html"
            test -s "$page" || { echo "missing $page"; exit 1; }
          done
          echo "$(ls _site/*.html | wc -l) pages in _site/"
      - name: Spelling (config in .codespellrc)
        run: codespell
      - name: Internal links resolve
        run: python3 tools/check_links.py --site _site
