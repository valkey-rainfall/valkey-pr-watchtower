name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline test suite
        working-directory: scripts
        run: |
          # Zero-dependency stdlib tests; no network or token needed.
          # Bash runs with -e, so any module exiting non-zero fails the job.
          for t in test_enrich test_buckets test_outreach test_render; do
            echo "::group::$t"
            python3 "$t.py"
            echo "::endgroup::"
          done
